[package]
name = "lifeagent-plugin-diet"
version = "0.1.0"
license = "MIT"
edition = "2021"
description = "Diet tracking plugin: meal logging, nutrition targets, diet plan section."

[dependencies]
lifeagent-core = { workspace = true }
lifeagent-llm = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# Batch import (`docs/NUTRITION_SOURCES.md` §6.1): quoted fields with commas, newlines and
# escaped quotes are exactly the edge cases a hand-rolled CSV splitter gets wrong.
csv = "1"

[dev-dependencies]
lifeagent-core = { workspace = true, features = ["test-support"] }
