[package]
name = "lifeagent-server"
version = "0.1.0"
edition = "2021"
description = "HTTP backend for the web build: accounts, per-user CoreApps, the shared command API."

[dependencies]
lifeagent-core = { workspace = true }
lifeagent-llm = { workspace = true }
lifeagent-plugin-diet = { workspace = true }
lifeagent-api = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# HTTP server and routing. Tokio-native, and its extractors replace the request parsing a raw
# hyper server would need.
axum = "0.8"
# Serving the built UI (static files with an index.html fallback for client-side routes).
tower-http = { version = "0.6", features = ["fs"] }
# The SSE stream for `/api/events` is built from a broadcast receiver.
futures-util = { version = "0.3", default-features = false }
# Password hashing (Argon2id, the current OWASP recommendation). Hand-rolling this is not an
# option.
argon2 = "0.5"
# Session tokens: 32 bytes from the OS RNG, stored only as a SHA-256 hash.
getrandom = "0.3"
sha2 = "0.10"

[dev-dependencies]
lifeagent-core = { workspace = true, features = ["test-support"] }
reqwest = { workspace = true }
