[package]
name = "lifeagent-core"
version = "0.1.0"
edition = "2021"
description = "Storage, plugin API, orchestrator, planner and scheduler for LifeAgent."

[dependencies]
lifeagent-llm = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
keyring = { workspace = true }
directories = { workspace = true }
tempfile = { workspace = true, optional = true }

[features]
# Exposes `test_support` to other crates' tests (enabled by lifeagent-plugin-diet's
# dev-dependency). Never enabled in a real build.
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = { workspace = true }
