[package]
name = "lifeagent-core"
version = "0.1.0"
license = "MIT"
edition = "2021"
description = "Storage, plugin API, orchestrator, planner and scheduler for LifeAgent."

[dependencies]
lifeagent-llm = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
keyring = { workspace = true }
# Per-user Postgres login passwords (`db.rs`): derived with HMAC-SHA256 and stored as a SCRAM
# verifier, so no plaintext password reaches the server. The same versions sqlx-postgres
# already uses for SCRAM, so no new crates enter the build.
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"

[features]
# Exposes `test_support` to other crates' tests (enabled by lifeagent-plugin-diet's
# dev-dependency). Never enabled in a real build.
test-support = []

