[workspace]
resolver = "2"
members = [
    "crates/llm",
    "crates/core",
    "crates/plugin-diet",
    "crates/plugin-stock",
    "crates/api",
    "crates/cli",
    "crates/server",
]

# Shared across crates; member Cargo.toml files pull these in with `dep.workspace = true`
# so versions stay in lockstep. See CLAUDE.md "Keep dependencies minimal".
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "charset"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = "4"
directories = "6"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
# Hides terminal input for `lifeagent-cli models set-key` (§11, §12: keys never touch the
# screen or shell history). Small, focused, cross-platform (incl. Windows) — no reason to
# hand-roll termios/console handling for one prompt.
rpassword = "7"

lifeagent-llm = { path = "crates/llm" }
lifeagent-core = { path = "crates/core" }
lifeagent-plugin-diet = { path = "crates/plugin-diet" }
lifeagent-plugin-stock = { path = "crates/plugin-stock" }
lifeagent-api = { path = "crates/api" }
