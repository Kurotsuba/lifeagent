# Cloud Run environment for the `lifeagent` service (non-secret values only; secrets are mapped
# with --set-secrets in deploy.sh). See crates/server/src/config.rs for every variable.

# Through the Cloud SQL socket Cloud Run mounts (--add-cloudsql-instances). The password comes
# from the db-password secret as LIFEAGENT_DB_PASSWORD. sqlx needs a host in the URL; the
# host= parameter replaces it with the socket directory.
LIFEAGENT_DATABASE_URL: "postgres://lifeagent_app@localhost/lifeagent?host=/cloudsql/human-health-handler:asia-northeast1:lifeagent"

# Core computes logical dates and plan_time in the process's time zone; Cloud Run runs in UTC.
TZ: "Asia/Tokyo"

RUST_LOG: "info"

# Gemini on Agent Platform, authenticated as the service's own service account (no key).
# parser: cheapest model for frequent structured extraction; conversation: fast tool use;
# planner: strongest model, about one call per user per day. 3.1 Pro exists only as a
# preview ID on Agent Platform. Gemini 3 models get no temperature (the provider drops it).
LIFEAGENT_MODELS: >-
  {"providers":[{"id":"vertex","kind":"open_ai_compatible","auth":"google_cloud",
  "base_url":"https://aiplatform.googleapis.com/v1/projects/human-health-handler/locations/global/endpoints/openapi"}],
  "parser":{"provider_id":"vertex","model":"google/gemini-3.5-flash-lite"},
  "planner":{"provider_id":"vertex","model":"google/gemini-3.1-pro-preview"},
  "conversation":{"provider_id":"vertex","model":"google/gemini-3.8-flash"}}
