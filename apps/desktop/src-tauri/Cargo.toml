[package]
name = "lifeagent-desktop"
version = "0.1.0"
edition = "2021"
description = "LifeAgent desktop app: Tauri 2 shell, composition root for CoreApp + plugins."

[lib]
name = "lifeagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lifeagent-core = { workspace = true }
lifeagent-llm = { workspace = true }
lifeagent-plugin-diet = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# Adds tauri's `test` feature (mock runtime, real IPC round-trips) on top of the main
# dependency's `tray-icon` for test builds only — Cargo unions features across dependency
# declarations of the same crate, so a release build never pulls this in.
tauri = { version = "2", features = ["test"] }
tempfile = { workspace = true }
